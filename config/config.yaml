  entry_level_title_tokens:
    - associate
    - junior
    - jr
    - trainee
    - graduate
    - new grad
    - entry level
    - intern
    - internship
    - sde-1
    - sde 1
    - sde1
  max_min_experience: 2
  keep_unknown_experience: true
  target_grad_years: [2027]
  allow_unspecified_grad_year: true
  require_title_any: [intern, interns, internship, internships]
  countries: [India]
  include_remote_unspecified: false

polling:
  tier1_min_interval_minutes: 15
  tier2_min_interval_minutes: 60
  tier3_min_interval_minutes: 1440
  priority_min_interval_minutes: 15
  concurrency: 30
  timeout_seconds: 15
  retries: 3
  user_agent: "JobRadar/1.0 (personal job search)"

alerts:
  email_enabled: true
  max_jobs_per_email: 100
  daily_digest_hour_ist: 8
  ntfy_topic: ""
  repeat_suppression_days: 120   # never re-alert the same opening (company + normalized title) within this window
  dismissed_path: config/dismissed.txt  # job URLs / job IDs you are done with; never alerted or digested

export:
  excel_path: data/jobs.xlsx

limits:
  disable_after_consecutive_404: 5
  close_after_missed_cycles: 2
  empty_streak_before_close: 3
